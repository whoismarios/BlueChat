name: bluechat

# Alles starten:            docker compose up
# Nur Infrastruktur:        docker compose up db sandbox   (+ lokal: npm run dev)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bluechat
      POSTGRES_PASSWORD: bluechat
      POSTGRES_DB: bluechat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluechat -d bluechat"]
      interval: 5s
      timeout: 5s
      retries: 20

  sandbox:
    build: ./sandbox
    image: bluechat-sandbox:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - sandbox_data:/workspace
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://bluechat:bluechat@db:5432/bluechat
      SANDBOX_URL: http://sandbox:8000
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Europe/Berlin
    volumes:
      - .:/app
      # eigene Linux-Abhängigkeiten im Container (Host-node_modules enthalten macOS-Binaries)
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_healthy

volumes:
  pgdata:
  sandbox_data:
